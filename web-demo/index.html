<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎰 拉霸機 · Web Demo（5 連線）</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    background:radial-gradient(circle at 50% 18%,#1c0c46 0%,#0c0524 55%,#05020f 100%);
    color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;overflow:hidden;user-select:none}
  .skyline{position:fixed;left:0;right:0;bottom:0;height:150px;display:flex;align-items:flex-end;justify-content:center;gap:6px;opacity:.5;z-index:0}
  .bld{background:#1a0a3e;border-top:1px solid #2c1860}
  .cab{position:relative;z-index:1;width:min(94vw,660px);background:#1a0b3a;border:7px solid #c8940c;border-radius:24px;
    padding:18px;box-shadow:0 0 60px rgba(120,70,255,.35),inset 0 0 40px rgba(0,0,0,.5)}
  .title{text-align:center;background:#08031a;border:3px solid #ffd732;border-radius:12px;padding:8px 0;color:#ffd732;
    font-size:clamp(20px,4.5vw,28px);font-weight:800;letter-spacing:6px;text-shadow:0 0 14px rgba(255,210,60,.7)}
  .bulbs{display:flex;justify-content:center;gap:8px;margin:10px 0 12px}
  .bulb{width:13px;height:13px;border-radius:50%;animation:blink 1.1s infinite}
  @keyframes blink{0%,100%{opacity:1;box-shadow:0 0 8px #ffe23c}50%{opacity:.25;box-shadow:none}}
  .reels{display:flex;justify-content:center;gap:14px}
  .win{width:150px;height:204px;background:#fcf6e1;border:5px solid #c8940c;border-radius:12px;overflow:hidden;position:relative;
    box-shadow:inset 0 6px 14px rgba(60,30,0,.3),inset 0 -6px 14px rgba(60,30,0,.3)}
  .win .ln{position:absolute;left:0;right:0;height:1px;background:rgba(150,110,10,.4);z-index:2}
  .strip{position:absolute;top:0;left:0;width:100%}
  .cell{height:68px;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800;font-family:Georgia,serif}
  .cell.bar{font-size:24px;letter-spacing:1px}
  .cell.hot{animation:pulse .32s ease-in-out 3}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}
  .pay{display:flex;justify-content:center;gap:14px;margin:12px 0 0;color:#d8c38a;font-size:13px;flex-wrap:wrap}
  .pay b{color:#ffd732}
  .result{text-align:center;margin:12px auto 0;max-width:560px;background:#0c051e;border:2px solid #c8940c;border-radius:10px;
    padding:9px;font-size:clamp(14px,3vw,17px)}
  .score{text-align:center;color:#5ae65a;font-size:clamp(24px,5.5vw,32px);font-weight:800;margin:14px 0 6px;text-shadow:0 0 12px rgba(90,230,90,.5)}
  .betrow{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:14px}
  .bet{min-width:170px;text-align:center;background:#08031a;border:2px solid #c8940c;border-radius:10px;padding:10px 0;color:#ffc35a;font-size:17px;font-weight:700}
  .ctrl{display:flex;justify-content:center;gap:14px}
  .btn{cursor:pointer;border:3px solid #ffd732;border-radius:16px;color:#ffe796;font-weight:800;transition:transform .08s,filter .15s;display:flex;align-items:center;justify-content:center}
  .btn:hover{filter:brightness(1.12)}
  .btn:active{transform:scale(.95)}
  .pm{width:54px;height:48px;background:#7a4600;font-size:30px}
  .spin{flex:1;max-width:320px;height:62px;background:linear-gradient(#ffb52e,#d27800);color:#3a1d00;font-size:26px;letter-spacing:3px}
  .auto{width:150px;height:62px;background:#7a4600;font-size:20px}
  .bigwin{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none;
    background:rgba(8,3,24,.95);border:6px solid #ffd732;border-radius:24px;padding:24px 46px;text-align:center;
    transition:transform .4s cubic-bezier(.2,1.5,.5,1),opacity .25s;box-shadow:0 0 50px rgba(255,210,60,.6)}
  .bigwin .t{color:#ffd732;font-size:clamp(32px,7vw,48px);font-weight:900;letter-spacing:2px;text-shadow:0 0 18px rgba(255,210,60,.8)}
  .bigwin .a{color:#7bff9c;font-size:clamp(24px,5.5vw,36px);font-weight:800;margin-top:8px}
  .foot{position:fixed;bottom:10px;z-index:1;color:#6b5da0;font-size:12px;letter-spacing:1px}
  .hint{color:#8a7ec0;font-size:12px;text-align:center;margin-top:10px}
</style>
</head>
<body>
  <div class="skyline" id="skyline"></div>
  <div class="cab">
    <div class="title">777　拉霸機　777</div>
    <div class="bulbs" id="bulbs"></div>
    <div class="reels" id="reels"></div>
    <div class="pay">777 <b>×60</b>　·　三連線 <b>×8–25</b>　·　兩連線 <b>×1–3</b>　·　5 條線　·　RTP <b>94%</b></div>
    <div class="result" id="result">— 按 SPIN 或空白鍵開始（5 條連線）—</div>
    <div class="score" id="score">分數　1000</div>
    <div class="betrow">
      <div class="btn pm" id="minus">−</div>
      <div class="bet" id="bet">押注 10（5線）</div>
      <div class="btn pm" id="plus">＋</div>
    </div>
    <div class="ctrl">
      <div class="btn spin" id="spin">SPIN ▶</div>
      <div class="btn auto" id="auto">AUTO ▶</div>
    </div>
    <div class="hint">空白鍵 = SPIN　·　↑↓ = 調押注　·　5 條線：上 / 中 / 下 / ↘ / ↗</div>
    <div class="bigwin" id="bigwin"><div class="t" id="bwt">BIG WIN</div><div class="a" id="bwa">+0</div></div>
  </div>
  <div class="foot">Cocos Creator 3.8.8 作品集 · 網頁 Demo</div>
<script>
(function(){
  var SYM=['7','★','◆','♣','♥','BAR'];
  var COL={'7':'#ff4d4d','★':'#ffd23a','◆':'#4db6ff','♣':'#57e08a','♥':'#ff5d8f','BAR':'#c08bff'};
  var BET=[10,20,50,100];
  var WEIGHTS=[2,3,5,6,6,4], WSUM=26;
  var TRIPLE=[60,25,12,8,8,15], PAIR=[3,1,1,1,1,2];
  var PAYLINES=[[0,0,0],[1,1,1],[2,2,2],[0,1,2],[2,1,0]];
  var betIdx=0, score=1000, spinning=false, auto=false;
  var CELL=68, LEN=24, LAND=LEN-2, DUR=[1.0,1.4,1.8];
  var $=function(id){return document.getElementById(id)};
  function bet(){return BET[betIdx]}
  function rand(n){return Math.floor(Math.random()*n)}
  function pick(){var r=rand(WSUM);for(var i=0;i<6;i++){r-=WEIGHTS[i];if(r<0)return i;}return 5}
  function setCell(el,i){el.textContent=SYM[i];el.style.color=COL[SYM[i]];el.className='cell'+(SYM[i]==='BAR'?' bar':'')}
  function evalLine(a,b,c){
    if(a===b&&b===c)return{mult:TRIPLE[a],jackpot:a===0};
    if(a===b||b===c||a===c){var s=a===b?a:b===c?b:a;return{mult:PAIR[s],jackpot:false};}
    return{mult:0,jackpot:false};
  }
  function evalGrid(grid){
    var total=0,jp=false,wins=[];
    for(var li=0;li<PAYLINES.length;li++){var pl=PAYLINES[li];
      var r=evalLine(grid[0][pl[0]],grid[1][pl[1]],grid[2][pl[2]]);
      if(r.mult>0){total+=r.mult;if(r.jackpot)jp=true;wins.push({mult:r.mult,cells:[[0,pl[0]],[1,pl[1]],[2,pl[2]]]});}
    }
    return{totalMult:total,jackpot:jp,wins:wins};
  }
  var AC=null;
  function tone(f,d,t,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=t||'square';o.frequency.value=f;o.connect(g);g.connect(AC.destination);var n=AC.currentTime;g.gain.setValueAtTime(v||0.05,n);g.gain.exponentialRampToValueAtTime(0.0001,n+d);o.start(n);o.stop(n+d)}catch(e){}}
  function sndSpin(){tone(200,0.08,'square',0.035)}
  function sndStop(){tone(330,0.06,'triangle',0.05)}
  function sndWin(){[523,659,784].forEach(function(f,i){setTimeout(function(){tone(f,0.18,'triangle',0.06)},i*90)})}
  function sndJackpot(){[523,659,784,1047,1319].forEach(function(f,i){setTimeout(function(){tone(f,0.22,'sawtooth',0.05)},i*110)})}

  var sky=$('skyline'),hs=[120,80,150,95,135,70,110,90,140,100,125,85];
  hs.forEach(function(h,i){var b=document.createElement('div');b.className='bld';b.style.width=(34+(i%3)*10)+'px';b.style.height=h+'px';sky.appendChild(b)});
  var bw=$('bulbs');
  for(var i=0;i<16;i++){var b=document.createElement('div');b.className='bulb';b.style.background=i%2?'#4e3a0e':'#ffee3c';b.style.animationDelay=(i*0.07)+'s';bw.appendChild(b)}

  var reels=[], rw=$('reels');
  for(var r=0;r<3;r++){
    var win=document.createElement('div');win.className='win';
    var l1=document.createElement('div');l1.className='ln';l1.style.top=CELL+'px';
    var l2=document.createElement('div');l2.className='ln';l2.style.top=(CELL*2)+'px';
    var strip=document.createElement('div');strip.className='strip';
    var cells=[];
    for(var k=0;k<LEN;k++){var s=document.createElement('div');setCell(s,pick());strip.appendChild(s);cells.push(s)}
    for(var rw2=0;rw2<3;rw2++){setCell(cells[LAND-1+rw2],2);}
    strip.style.transform='translateY('+(-(LAND-1)*CELL)+'px)';
    win.appendChild(strip);win.appendChild(l1);win.appendChild(l2);rw.appendChild(win);
    reels.push({win:win,strip:strip,cells:cells,rows:[2,2,2]});
  }

  function render(){$('score').textContent='分數　'+score;$('bet').textContent='押注 '+bet()+'（5線）'}
  function result(t,c){var e=$('result');e.textContent=t;e.style.color=c||'#fff'}
  function countUp(from,to){var t0=performance.now();(function step(now){var p=Math.min(1,(now-t0)/650);var v=Math.round(from+(to-from)*p);$('score').textContent='分數　'+v;if(p<1)requestAnimationFrame(step)})(t0)}
  function flashCells(wins){var seen={};wins.forEach(function(w){w.cells.forEach(function(c){var key=c[0]+'-'+c[1];if(seen[key])return;seen[key]=true;var el=reels[c[0]].cells[LAND-1+c[1]];el.classList.remove('hot');void el.offsetWidth;el.classList.add('hot')})})}
  function bigWin(amt,jp){var o=$('bigwin');$('bwt').textContent=jp?'★ JACKPOT ★':'BIG WIN';$('bwa').textContent='+'+amt;o.style.opacity='1';o.style.transform='translate(-50%,-50%) scale(1)';setTimeout(function(){o.style.opacity='0';o.style.transform='translate(-50%,-50%) scale(.3)'},1600)}
  function syncAuto(){var a=$('auto');a.textContent=auto?'AUTO ⏸':'AUTO ▶';a.style.background=auto?'#ffcc32':'#7a4600';a.style.color=auto?'#241500':'#ffe796'}

  function spin(){
    if(spinning)return;
    if(score<bet()){
      if(score<BET[0]){score=1000;result('已補滿 1000 分，再來！','#7bff9c');auto=false;syncAuto();render();return}
      result('餘額不足，請降低押注','#ff6b6b');auto=false;syncAuto();return;
    }
    spinning=true;score-=bet();render();result('轉動中…','#ffffff');sndSpin();
    reels.forEach(function(R,ri){
      var prev=R.rows, nu=[pick(),pick(),pick()];
      R.rows=nu;
      R.cells.forEach(function(el){setCell(el,pick());el.classList.remove('hot')});
      for(var rw=0;rw<3;rw++){setCell(R.cells[rw],prev[rw]);}
      for(var rw=0;rw<3;rw++){setCell(R.cells[LAND-1+rw],nu[rw]);}
      R.strip.style.transition='none';R.strip.style.transform='translateY(0)';
      R.strip.offsetHeight;
      R.strip.style.transition='transform '+DUR[ri]+'s cubic-bezier(.12,.62,.28,1)';
      R.strip.style.transform='translateY('+(-(LAND-1)*CELL)+'px)';
      setTimeout(sndStop,DUR[ri]*1000);
    });
    setTimeout(onEnd,DUR[2]*1000+80);
  }
  function onEnd(){
    spinning=false;
    var grid=[reels[0].rows,reels[1].rows,reels[2].rows];
    var e=evalGrid(grid), win=e.totalMult*(bet()/5);
    if(e.wins.length>0){
      if(e.jackpot){result('★ JACKPOT 777 ★　共 ×'+e.totalMult,'#ffd732');sndJackpot();}
      else{result('✨ '+e.wins.length+' 條連線　共 ×'+e.totalMult,'#5ae6a5');sndWin();}
      flashCells(e.wins);
      if(e.jackpot||e.totalMult>=20)bigWin(win,e.jackpot);
    }else{result('再接再厲','#b9ac9b');}
    if(win>0){var from=score;score+=win;countUp(from,score);render()}else render();
    if(auto)setTimeout(function(){if(auto&&!spinning&&score>=bet())spin()},1100);
  }

  $('spin').onclick=spin;
  $('minus').onclick=function(){if(!spinning){betIdx=(betIdx+BET.length-1)%BET.length;render()}};
  $('plus').onclick=function(){if(!spinning){betIdx=(betIdx+1)%BET.length;render()}};
  $('auto').onclick=function(){auto=!auto;syncAuto();if(auto&&!spinning)spin()};
  document.addEventListener('keydown',function(e){
    if(e.code==='Space'){e.preventDefault();spin()}
    else if(e.code==='ArrowUp'){if(!spinning){betIdx=(betIdx+1)%BET.length;render()}}
    else if(e.code==='ArrowDown'){if(!spinning){betIdx=(betIdx+BET.length-1)%BET.length;render()}}
  });
  render();
})();
</script>
</body>
</html>
